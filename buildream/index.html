<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Build Dream</title>
</head>
<body>

    <section class="hero_promotion_nav_container">
        <!-- Promotional Banner -->
        <div class="promotion_banner">
            <div class="promotional_contact_top_border"></div>

            <div class="promotion_contact_container">
                <h3>Free Call:</h3>
                <p>+1 415 555 0142</p>
            </div>

            <div class="promotion_email_and_icon_container">
                <div class="promotion_contact_container">
                    <h3>Email Address:</h3>
                    <p>info@example.com</p>
                </div>
                <div class="promotional_banner_icons_container">
                    <div class="promotional_banner_single_icon_container">
                        <i class="fa-brands fa-twitter"></i>
                    </div>
                    <div class="promotional_banner_single_icon_container">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <div class="promotional_banner_single_icon_container">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navbar -->
         <div class="navbar_main_container">
            <div class="nav_logo_bg"></div>
            <div class="navbar_logo_section">
                <h2>BUILDREAM</h2>
            </div>

            <div class="navbar_list">
                <input type="radio" name="navbar" id="home" checked />
                <li for="home"  class="navbar_list_item">
                    <a href="#" class="navbar_list_item_anchor">HOME</a>
                </li>

                <input type="radio" name="navbar" id="about" />
                <li for="about" class="navbar_list_item">
                    <a href="#" class="navbar_list_item_anchor">ABOUT</a>
                </li>
                <li class="navbar_list_item">
                    <a href="#" class="navbar_list_item_anchor">SERVICES</a>
                </li>
                <li class="navbar_list_item">
                    <a href="#" class="navbar_list_item_anchor">PROJECTS</a>
                </li>
                <li class="navbar_list_item">
                    <a href="#" class="navbar_list_item_anchor">PRICING</a>
                </li>
                <li class="navbar_list_item">
                    <a href="#" class="navbar_list_item_anchor">BLOG</a>
                </li>
                <li class="navbar_list_item">
                    <a href="#" class="navbar_list_item_anchor">CONTACT</a>
                </li>
            </div>
         </div>

         <div class="hero_section">
            <!-- BG Image Container -->
             <div class="hero_section_overlay"></div>

             <div class="hero_section_content_main_container">
                <div class="hero_section_content_border_container"></div>

                <div class="hero_section_inner_content_section">
                    <p class="hero_since">SINCE 1982</p>
                    <h2 class="hero_main_heading">WE WILL BE <span>HAPPY</span> TO TAKE <br /> CARE OF YOUR WORK</h2>

                    <div class="hero_section_inner_content_buttons_container">
                        <div class="hero_section_contact_button">
                            <span>CONTACT US</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                        <div class="hero_section_quote_button">
                            <span>REQUEST A QUOTE</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
             </div>
            
         </div>


    </section>

    <h3>Rashid Panhwer</h3>
    
</body>
</html>
