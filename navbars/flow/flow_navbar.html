<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awsome URL -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <!-- Google Poppins Font -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montez&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <!-- Style Sheet -->
     <link rel="stylesheet" href="../index.css" />

    <title>Flow Navbar</title>
    
  </head>
  <body class="flow_nav_body">

    <div class="flow_nav_main_container">
        <!-- Desktop Navbar -->
        <div class="flow_nav_desktop_main_container">
            <!-- Logo Container -->
            <div class="flow_nav_logo_main_container">
                <div class="flow_logo_dot"></div>
                <h3>FLOW</h3>
            </div>

            <!-- Nav Items Container -->
             <ul class="flow_nav_items_container">
                <li>
                    <a href="#">Home</a>
                </li>
                <li>
                    <a href="#">Product</a>
                </li>
                <li>
                    <a href="#">Docs</a>
                </li>
                <li>
                    <a href="#">Blogs</a>
                </li>
             </ul>

            <!-- Nav Buttons -->
             <button class="flow_nav_signup_button">Sign up</button>
        </div>

        <!-- Mobile Navbar -->
         <div class="flow_mobile_outer_container">
            <!-- Mobile Logo Container -->
            <div class="flow_nav_logo_main_container">
                <div class="flow_logo_dot"></div>
                <h3>FLOW</h3>
            </div>

            <i class="fa-solid fa-bars" style="font-size: 30px; color: rgba(255, 255, 255, 0.8);"></i>
         </div>
    </div>
  </body>
</html>
