<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css" />
    <title>Facebook Login</title>
</head>
<body>
    <section class="login_form_main_section">
        <div class="login_form_left_container">
            <h3>Facebook</h3>
            <p>
                Connect with friends and the world
                <br />
                around you on Facebook.
            </p>
        </div>
        <!-- Facebook login form container -->
        <div class="login_form_right_container">
            <form class="login_form_right_form_container">
                <input type="text" placeholder="Email or phone number" />
                <input type="password" placeholder="Password" />
                <button>Login</button>
                <a href="#">Forgot Password?</a>
                <div class="login_form_create_new_account_container">
                    <button>Create new account</button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>
