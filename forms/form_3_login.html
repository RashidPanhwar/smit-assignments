<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <style>
      body {
        font-family: "Times New Roman", Times, serif;
        background-color: #fff;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
        margin: 0;
      }

      .form-container {
        width: 100%;
        max-width: 500px;
      }

      .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
      }

      .form-row.radio-row,
      .form-row.checkbox-row {
        align-items: flex-start;
      }

      .form-row label.field-label {
        width: 160px;
        min-width: 160px;
        font-size: 1rem;
        color: #000;
        line-height: 1.4;
      }

      .form-row input[type="text"],
      .form-row input[type="password"] {
        flex: 1;
        padding: 5px 8px;
        font-size: 1rem;
        border: 2px solid #7ec8e3;
        background: #fff;
        box-sizing: border-box;
      }

      select {
        flex: 1;
        padding: 5px 8px;
        font-size: 1rem;
        border: 2px solid #7ec8e3;
        background: #fff;
        box-sizing: border-box;
      }

      .radio-options,
      .checkbox-options {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        padding-top: 2px;
      }

      .radio-options label,
      .checkbox-options label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1rem;
        color: #000;
      }

      .radio-options input[type="radio"],
      .checkbox-options input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      .btn-row {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-top: 20px;
      }

      .btn-row button {
        padding: 6px 22px;
        font-size: 1rem;
        font-family: "Times New Roman", Times, serif;
        background: #e8e8e8;
        border: 2px solid #7ec8e3;
        cursor: pointer;
        border-radius: 2px;
      }

      .btn-row button:hover {
        background: #d0d0d0;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <form action="#" method="post">

        <!-- Username -->
        <div class="form-row">
          <label class="field-label" for="username">Username:</label>
          <input type="text" id="username" name="username" />
        </div>

        <!-- Password -->
        <div class="form-row">
          <label class="field-label" for="password">Password:</label>
          <input type="password" id="password" name="password" />
        </div>

        <!-- City of Employment -->
        <div class="form-row">
          <label class="field-label" for="city">City of<br />Employment:</label>
          <input type="text" id="city" name="city" />
        </div>

        <!-- Web Server -->
        <div class="form-row">
          <label class="field-label" for="server">Web server:</label>
          <select id="server" name="server">
            <option value="" disabled selected>— Choose a server —</option>
            <option value="apache">Apache</option>
            <option value="nginx">Nginx</option>
            <option value="iis">IIS</option>
            <option value="node">Node.js</option>
          </select>
        </div>

        <!-- Role (Radio) -->
        <div class="form-row radio-row">
          <label class="field-label">Please specify<br />your role:</label>
          <div class="radio-options">
            <label><input type="radio" name="role" value="admin" /> Admin</label>
            <label><input type="radio" name="role" value="engineer" /> Engineer</label>
            <label><input type="radio" name="role" value="manager" /> Manager</label>
            <label><input type="radio" name="role" value="guest" /> Guest</label>
          </div>
        </div>

        <!-- Single Sign-on (Checkbox) -->
        <div class="form-row checkbox-row">
          <label class="field-label">Single Sign-on<br />to the following:</label>
          <div class="checkbox-options">
            <label><input type="checkbox" name="sso" value="mail" /> Mail</label>
            <label><input type="checkbox" name="sso" value="payroll" /> Payroll</label>
            <label><input type="checkbox" name="sso" value="self-service" /> Self-service</label>
          </div>
        </div>

        <!-- Buttons -->
        <div class="btn-row">
          <button type="submit">Login</button>
          <button type="reset">Reset</button>
        </div>

      </form>
    </div>
  </body>
</html>
